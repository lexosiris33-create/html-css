<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formularios</title>
</head>
<body>
    <!--Require hace que un dato sea necesario para ser enviado el form-->
    <!--el atributo name nos permite acceder a los valores de los campos identifica la data-->
    <!--placeholder es un helper para el usuario, le permite comprender que datos son requeridos en los campos, incluso ejemplificando no todos los inputs tienen placeholder funcional-->
    <!--value queda pendiente en el curso-->
    <!--minlenght y maxlenght permite condicionar la longitud minima y maxima de una cadena como condicion para su envio-->
    <form action="">
        <input type="text" name="" id="" placeholder="Texto">
        <!--Genera un formato ue trata de hacer que cumpla con las expresion regular de email-->
        <input type="email" name="" id="" placeholder="Correo Electronico">
        <input type="password" name="" id="" placeholder="Aqui va la contraseña">
        <input type="checkbox" name="" id="">
        <input type="radio"> <!--El radio sirve solo para selecciona una opcion-->
        <input type="date" required>
        <input type="file">
        <input type="submit" value="Send">
    </form>
</body>
</html>
