<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Listas</title>
</head>
<body>
    <!--Lista Ordenada-->
    <ol>
        <li>Elementos 1</li>
        <li>Elementos 2</li>
        <li>Elementos 3</li>
    </ol>

    <!--Lista Desordenada se usan cuando algo no tiene orden solo presenta puntos en lugar de numeros-->
    <ul>
        <li>Elementos 1</li>
        <li>Elementos 2</li>
        <li>Elementos 3</li>
    </ul>

</body>
</html>
